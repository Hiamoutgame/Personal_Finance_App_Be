services:
  - type: web
    name: personal-finance-management-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApplyMigrations
        value: "true"
      - key: EnableSwagger
        value: "true"
      - key: ConnectionStrings__RenderConnection
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtOptions__SecretKey
        sync: false
      - key: JwtOptions__Issuer
        value: PersonalFinanceManagement
      - key: JwtOptions__Audience
        value: PersonalFinanceManagement
      - key: JwtOptions__ExpireMinutes
        value: "120"
      - key: SeedAccounts__Enabled
        sync: false
      - key: SeedAccounts__ResetPasswords
        sync: false
      - key: SeedAccounts__Accounts__0__Username
        sync: false
      - key: SeedAccounts__Accounts__0__Email
        sync: false
      - key: SeedAccounts__Accounts__0__Password
        sync: false
      - key: SeedAccounts__Accounts__0__FirstName
        sync: false
      - key: SeedAccounts__Accounts__0__LastName
        sync: false
      - key: SeedAccounts__Accounts__0__Role
        sync: false
      - key: SeedAccounts__Accounts__1__Username
        sync: false
      - key: SeedAccounts__Accounts__1__Email
        sync: false
      - key: SeedAccounts__Accounts__1__Password
        sync: false
      - key: SeedAccounts__Accounts__1__FirstName
        sync: false
      - key: SeedAccounts__Accounts__1__LastName
        sync: false
      - key: SeedAccounts__Accounts__1__Role
        sync: false
      - key: CloudinaryOptions__CloudName
        sync: false
      - key: CloudinaryOptions__ApiKey
        sync: false
      - key: CloudinaryOptions__ApiSecret
        sync: false
      - key: MailOptions__Mail
        sync: false
      - key: MailOptions__DisplayName
        value: Personal Finance
      - key: MailOptions__Password
        sync: false
      - key: MailOptions__Host
        value: smtp.gmail.com
      - key: MailOptions__Port
        value: "587"
      - key: Ocr__BaseUrl
        sync: false
      - key: Ocr__Layout
        value: invoice
      - key: Ocr__TimeoutSeconds
        value: "120"
      - key: GoogleAI__ApiKey
        sync: false
      - key: GoogleAI__DefaultModel
        value: gemini-2.5-flash
      - key: GoogleAI__IsEnabled
        value: "true"
      - key: GoogleAI__Temperature
        value: "0.7"
      - key: GoogleAI__MaxTokens
        value: "1000"
      - key: GoogleAI__TimeoutSeconds
        value: "30"
      - key: GoogleAI__SystemPrompt
        value: "You are FinJar, a personal finance assistant. Answer in Vietnamese. Be concise, practical, and avoid exposing secrets or raw internal data."
      - key: CasooOptions__BaseUrlWebhooks
        value: https://oauth.casso.vn/v2/webhooks
      - key: CasooOptions__BaseUrlTransactions
        value: https://oauth.casso.vn/v2/transactions
      - key: CasooOptions__SecureToken
        sync: false
      - key: CasooOptions__TimeoutSeconds
        value: "30"
      - key: CasooOptions__ApiKey
        sync: false
