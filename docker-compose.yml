services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PersonalFinanceManagementDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MyStrongPassword123@}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - personal-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    container_name: personal-finance-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:${API_CONTAINER_PORT:-8080}
      PORT: ${API_CONTAINER_PORT:-8080}
      ApplyMigrations: ${APPLY_MIGRATIONS:-true}
      EnableSwagger: ${ENABLE_SWAGGER:-true}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-PersonalFinanceManagementDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-MyStrongPassword123@};
      ConnectionStrings__RenderConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-PersonalFinanceManagementDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-MyStrongPassword123@};
      Casso__RedirectUri: ${CASSO_REDIRECT_URI:-http://localhost:5284/api/v1/financial-accounts/casso/callback}
    ports:
      - "${API_HOST_PORT:-5284}:${API_CONTAINER_PORT:-8080}"

volumes:
  personal-finance-postgres-data:
